<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="structTitle structDesc" style="max-width:100%;height:auto" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
  <title id="structTitle">ZR.Admin.NET 项目结构</title>
  <desc id="structDesc">分层结构图：客户端层、接入层 ZR.Admin.WebApi、业务服务层 ZR.Service / ZR.ServiceCore / ZR.Workflow / ZR.Mall / ZR.CodeGenerator、数据访问层 ZR.Repository、实体层 ZR.Model、存储与中间件，以及横向共享的公共支撑 Infrastructure / ZR.Common / ZR.Tasks / ZR.Tests。</desc>

